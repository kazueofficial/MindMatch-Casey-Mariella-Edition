<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MindMatch: Casey & Mariella Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>MindMatch: Casey & Mariella Edition</h1>
<div id="turn">Player X's turn</div>

<div id="scores">
  Player X: <span id="scoreX">0</span> |
  Player O: <span id="scoreO">0</span>
</div>

<div id="board"></div>

<div id="questionBox" style="display:none;">
  <div id="question"></div>
  <input type="number" id="answerInput" />
  <button onclick="submitAnswer()">Submit</button>
</div>

<div id="status"></div>

<script src="script.js"></script>

</body>
</html>
